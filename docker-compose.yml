services:
  mysql:
    image: mysql:8.0
    container_name: qltt-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qltt
      MYSQL_USER: qltt
      MYSQL_PASSWORD: qltt
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    ports:
      - "3306:3306"
    volumes:
      - qltt-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qltt-mysql-data:
