spring:
  application:
    name: qltt
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/qltt?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:qltt}
    password: ${DB_PASSWORD:qltt}
  jpa:
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB         # CBR-24
      max-request-size: 21MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh

app:
  auth:
    so-lan-sai-toi-da: 5
    thoi-gian-khoa-phut: 15
  jwt:
    secret: ${JWT_SECRET:}        # bắt buộc đặt qua biến môi trường hoặc application-dev.yml
    expiration-hours: 8
  storage:
    dir: ${STORAGE_DIR:./uploads}
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
