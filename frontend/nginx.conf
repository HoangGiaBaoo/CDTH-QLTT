# Nginx trong image frontend: phục vụ bản build React và chuyển /api sang backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CBR-24: minh chứng / báo cáo tối đa 20 MB, cộng phần đầu multipart (khớp spring.servlet.multipart.max-request-size).
    client_max_body_size 21m;
    # Tệp lớn hơn bị Nginx chặn trước khi tới backend ⇒ trả đúng ApiResponse như GlobalExceptionHandler để giao diện
    # hiện nguyên văn thông điệp (không phải trang HTML 413).
    error_page 413 = @tep_qua_lon;
    location @tep_qua_lon {
        default_type application/json;
        charset utf-8;
        return 413 '{"success":false,"code":"FILE_TOO_LARGE","message":"Tệp vượt quá 20 MB (CBR-24)"}';
    }

    # Phân giải tên "backend" mỗi lần gọi (DNS nội bộ Docker) — mỗi lần deploy container backend đổi IP,
    # ghi cứng lúc khởi động thì Nginx sẽ trả 502 cho tới khi khởi động lại.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Tệp build của Vite có mã băm trong tên ⇒ cache lâu được.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả index.html để React Router xử lý.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
